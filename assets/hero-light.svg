  </defs>
  <rect width="1200" height="330" fill="#F7F8FA"/>
  <rect width="1200" height="330" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" fill="none" stroke="#E4E8EF"/>

  <rect x="64" y="70" width="5" height="132" rx="2.5" fill="#3E6C9E"/>

  <text x="92" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="3.4" fill="#3E6C9E">HOMEOPATHIC PHYSICIAN · BHMS · VADODARA, INDIA</text>
  <text x="92" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1.6" fill="#12161E">Dr. Sohil Momin</text>
  <text x="92" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#5A6473">Offline-first, open-source software for medicine, learning and play.</text>
  <text x="92" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#3E6C9E">One rule: it keeps working when the connection drops.</text>

