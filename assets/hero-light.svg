<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Dr. Sohil Momin — homeopathic physician building offline-first, open-source software for medicine, learning and play">
  <title>Dr. Sohil Momin — offline-first, open-source software for medicine, learning and play</title>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
