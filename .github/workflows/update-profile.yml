name: Update profile README

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: false   # this workflow pushes; never cancel it mid-commit
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate marked README regions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes — README already up to date."
          else
            git commit -m "chore: auto-update profile README"
            # retry: a bare `git push` loses the race when anything else commits first
            BR="${GITHUB_REF_NAME:-main}"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin "$BR" --quiet
              git rebase "origin/$BR" --quiet || { git rebase --abort || true; sleep 4; continue; }
              if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
              echo "::warning::push rejected on attempt $attempt - the branch moved again"
              sleep 4
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"; exit 1; }
          fi
