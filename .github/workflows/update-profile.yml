name: Update profile README

on:
  schedule:
    # Daily, not weekly. The run costs about ten seconds and is the thing that
    # notices a new repository, so a weekly cadence meant a repo added on Tuesday
    # was missing from the profile until the following Monday.
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  # Regenerate when the thing it reads changes, not only on a schedule. Editing a
  # description in catalogue.json used to leave the README stale for up to a week.
  push:
    branches: [ main ]
    paths:
      - catalogue.json
      - .github/scripts/update_profile.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: false   # this workflow pushes; never cancel it mid-commit
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1

      - name: Regenerate marked README regions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit if changed
        run: |
          # F-97: the verdict is "did README.md land", not "did git exit 0".
          #
          # This step had its own four-attempt rebase-and-push loop, written because a
          # bare `git push` loses the race. The loop was right and the verdict was still
          # wrong: a push that exited 0 was never checked against the branch.
          # tools/commit-and-verify.sh does both - the same backoff, then a blob-sha
          # comparison against origin/main.
          # catalogue.json is committed too: the run reconciles it against the live
          # repositories, so a new repo (or a description edited on GitHub) lands in
          # the same commit as the README that renders it.
          # The stats strip is drawn from the same numbers, so it is committed with
          # them - a picture of a count that can drift is worse than no picture.
          # The pills and achievement cards are generated too, and there is one per
          # project, so they are staged as directories: commit-and-verify hashes
          # regular files only and would skip a directory with a warning.
          git add -A assets/pills assets/achievements
          bash tools/commit-and-verify.sh "chore: auto-update profile README" main -- \
            README.md catalogue.json assets/stats-light.svg assets/stats-dark.svg \
            assets/progress-light.svg assets/progress-dark.svg