name: Add download blocks to landing pages

# 14 landing pages describe an app and offer no way to get it, even though those
# repos publish a real APK, EXE or installer. This inserts one download block
# above the footer of each, built from that repo's newest release.
#
#   * labels come from the file names (Android APK, Windows EXE, Linux, .zip)
#   * sizes are shown, because a 20 MB Linux binary and a 645 KB APK are very
#     different commitments
#   * the block is wrapped in <!-- download:start --> markers, so a second run
#     does nothing
#   * a page that already links a release asset is left alone
#   * the 10 repos with no published assets are skipped - a download button
#     there would be a lie
#
# Dry run reported: 14 pages, 0 skipped.
#
# SETUP: the AUDIT_TOKEN secret (needs Contents: Read and write).
# RUN: Actions -> "Add download blocks to landing pages" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unticked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is present
        env:
          AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: |
          if [ -z "$AUDIT_TOKEN" ]; then
            echo "::error::AUDIT_TOKEN is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "token present"

      - name: Add the blocks
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
          APPLY: ${{ inputs.apply }}
