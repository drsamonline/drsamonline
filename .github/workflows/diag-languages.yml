name: diag-languages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: metrics repositories query probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cat > q.graphql <<'GQL'
          query {
            user(login:"drsamonline") {
              repositories(first: 100, isFork: false, orderBy: {field: UPDATED_AT, direction: DESC}) {
                edges { cursor }
                nodes {
                  updatedAt name owner { login } isFork forkCount watchers { totalCount } stargazers { totalCount } releases { totalCount } deployments { totalCount } environments { totalCount }
                  languages(first: 8) { edges { size node { color name } } }
                  licenseInfo { name spdxId }
                  issues_open: issues(states: OPEN) { totalCount }
                  issues_closed: issues(states: CLOSED) { totalCount }
                  pr_open: pullRequests(states: OPEN) { totalCount }
                  pr_closed: pullRequests(states: CLOSED) { totalCount }
                  pr_merged: pullRequests(states: MERGED) { totalCount }
                }
              }
            }
          }
          GQL
          gh api graphql -F query=@q.graphql > out.json 2>err.txt
          echo "exit=$?"
          echo "=== err.txt ==="; head -c 1500 err.txt
          echo "=== out.json ==="; head -c 2500 out.json
          echo
          echo "=== parse ==="
          python3 -c "import json;d=json.load(open('out.json'));print('ERRORS:',json.dumps(d.get('errors'))[:1500]);ns=d.get('data',{}).get('user',{}).get('repositories',{}).get('nodes',[]);print('nodes:',len(ns));[print(n['name'],[(e['node']['name'],e['size']) for e in n['languages']['edges']]) for n in ns[:8]];print('nonzero-lang repos:',sum(1 for n in ns if n['languages']['edges']))" 2>&1 | head -40
