name: Apply everything outstanding

# One run, one file. Everything still pending, applied to app-builder:
#
#   tools/make_icons.py         NEW  .ico (16..256) + Android mipmaps (48..192)
#                                    + round icons, from the app's own artwork or
#                                    a monogram tile, so nothing ships iconless
#   tools/verify_icons.py       NEW  fails a build whose artefact has no icon
#   AndroidManifest.xml              android:icon and android:roundIcon
#   exe/build.py                     --icon for PyInstaller
#   .github/workflows/build.yml      generate the icons, wire them in, verify
#   drsoam.py                        blog posts link to the product page, not the
#                                    enquiry mailto
#
# The script is embedded below (base64) so this workflow is the only file you
# need. It is the exact script that was tested: dry run reported 6 files, and
# every edited file was checked to parse afterwards.
#
# Every change is a targeted string replacement, so a file that has moved on is
# reported as "pattern not found" instead of being clobbered. Re-running is safe.
#
# SETUP: the AUDIT_TOKEN secret (already added).
# RUN: Actions -> "Apply everything outstanding" -> Run workflow.
#      Unticked first to read the plan, then ticked to commit.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unticked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is present
        env:
          AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: |
          if [ -z "$AUDIT_TOKEN" ]; then
            echo "::error::AUDIT_TOKEN is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "token present"

      - name: Apply
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
          APPLY: ${{ inputs.apply }}
